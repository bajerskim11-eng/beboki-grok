<!doctype html>
<html lang="pl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Beboki — Serce Śląska</title><style>body{margin:0;font-family:system-ui,sans-serif;background:#17130f;color:#fff}*{box-sizing:border-box}.app{min-height:100vh;background:radial-gradient(circle at 50% 20%,#4b3020,#17130f 65%)}header{padding:28px 5vw;display:flex;justify-content:space-between;align-items:center}.logo{font-size:26px;font-weight:900}.logo span{color:#e6a84f}.tag{opacity:.7}.map{position:relative;margin:0 auto;max-width:1100px;height:72vh;min-height:560px;border-radius:32px;background:#d6c39b;overflow:hidden;box-shadow:0 20px 60px #0008}.map:before{content:'KATOWICE';position:absolute;inset:0;display:grid;place-items:center;font-size:clamp(70px,15vw,180px);font-weight:1000;color:#8f805f22;letter-spacing:.08em}.road{position:absolute;background:#b6a27b;transform:rotate(28deg);height:18px;border-radius:20px;opacity:.7}.r1{width:120%;top:35%;left:-10%}.r2{width:100%;top:62%;left:10%;transform:rotate(-20deg)}.r3{width:80%;top:18%;left:10%;transform:rotate(62deg)}.point{position:absolute;border:0;background:#211812;color:white;border-radius:50%;width:68px;height:68px;font-size:30px;cursor:pointer;box-shadow:0 8px 20px #0005;transition:.2s}.point:hover{transform:scale(1.12)}.p1{left:24%;top:31%}.p2{left:53%;top:48%}.p3{left:70%;top:25%}.p4{left:43%;top:70%}.label{position:absolute;transform:translate(-50%,75px);left:50%;white-space:nowrap;background:#fff;color:#211812;padding:7px 12px;border-radius:12px;font-size:13px;font-weight:800}.intro{text-align:center;padding:10px 20px 28px}.intro h1{font-size:clamp(34px,6vw,64px);margin:0 0 8px}.intro p{opacity:.75}.panel{position:fixed;inset:0;background:#0009;display:none;place-items:center;padding:20px}.comic{width:min(760px,100%);max-height:90vh;overflow:auto;background:#f4dfb5;color:#241810;border-radius:28px;padding:28px;box-shadow:0 30px 80px #000b}.close{float:right;border:0;background:#241810;color:white;border-radius:50%;width:38px;height:38px;cursor:pointer}.hero{font-size:72px}.comic h2{font-size:38px;margin:0}.frame{margin:20px 0;background:#fff8e8;border:4px solid #241810;border-radius:18px;padding:22px;min-height:120px;font-size:20px}.next{border:0;background:#241810;color:#fff;padding:14px 20px;border-radius:14px;font-weight:800;cursor:pointer}</style></head><body><div class="app"><header><div class="logo">👹 <span>BEBOKI</span></div><div class="tag">SERCE ŚLĄSKA</div></header><section class="intro"><h1>Mapa Beboków</h1><p>Katowice. Cztery historie. Jedna większa przygoda.</p></section><main class="map"><div class="road r1"></div><div class="road r2"></div><div class="road r3"></div><button class="point p1" onclick="openComic('hanys')">👹<span class="label">Hanys</span></button><button class="point p2" onclick="openComic('hople')">👹<span class="label">Hople</span></button><button class="point p3" onclick="openComic('fachure')">👹<span class="label">Fachure</span></button><button class="point p4" onclick="openComic('podciepa')">👹<span class="label">Podciepa</span></button></main></div><div class="panel" id="panel"><article class="comic"><button class="close" onclick="closeComic()">×</button><div class="hero" id="hero"></div><h2 id="title"></h2><p id="subtitle"></p><div id="frames"></div><button class="next" onclick="nextFrame()">DALEJ →</button></article></div><script>const data={hanys:{name:'Hanys',emoji:'👹',sub:'Pierwszy ślad Serca Śląska',frames:['Katowice zasypiały, ale Hanys wiedział, że tej nocy coś jest nie tak.','Na jednej z ulic znalazł mały, świecący ślad. Nie wyglądał jak zwykła rzecz.','„To nie je skarb” — pomyślał. „To coś, co prowadzi kajś dalij.”','Hanys postanowił sprawdzić, dokąd prowadzi ślad. Tak zaczęła się historia.']},hople:{name:'Hople',emoji:'👹',sub:'Ten, który zawsze rusza pierwszy',frames:['Hople nigdy długo nie siedział w jednym miejscu.','Kiedy usłyszał o tajemniczym śladzie, od razu ruszył jego tropem.','Po drodze zauważył coś jeszcze: samotnego pieska, który jakby na kogoś czekał.','Hople jeszcze nie wiedział, że piesek będzie częścią znacznie większej historii.']},fachure:{name:'Fachure',emoji:'👹',sub:'Każdy problem ma swoje rozwiązanie',frames:['Fachure przyjrzał się śladowi dokładniej niż wszyscy pozostali.','„Tu musi być jakiś myk” — mruknął.','Znalazł pierwszy znak ukryty w miejskim detalu.','Teraz potrzebował tylko swoich przyjaciół.']},podciepa:{name:'Podciepa',emoji:'👹',sub:'Najmniejszy sekret może zmienić wszystko',frames:['Podciepa znalazł coś, czego nikt wcześniej nie zauważył.','Mały symbol wyglądał jak fragment serca.','Nie wiedział jeszcze, skąd się wziął ani dlaczego świeci.','Zabrał go ze sobą. Cztery drogi właśnie zaczęły się łączyć.']}};let current,idx;function openComic(k){current=data[k];idx=0;document.getElementById('hero').textContent=current.emoji;document.getElementById('title').textContent=current.name;document.getElementById('subtitle').textContent=current.sub;render();document.getElementById('panel').style.display='grid'}function render(){document.getElementById('frames').innerHTML='<div class="frame">'+current.frames[idx]+'</div>'}function nextFrame(){if(idx<current.frames.length-1){idx++;render()}else{document.getElementById('frames').innerHTML='<div class="frame"><b>Koniec pierwszego rozdziału.</b><br><br>Ta historia będzie miała ciąg dalszy…</div>';}}function closeComic(){document.getElementById('panel').style.display='none'}</script></body></html>
